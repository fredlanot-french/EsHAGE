<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EsHAGE — Escrime Historique et Artistique du Grand Est</title>
<style>
  :root {
    --primary:#2563eb; --primary-dark:#1d4ed8; --bg:#ffffff; --card:#ffffff;
    --text:#0f172a; --muted:#64748b; --border:#e2e8f0; --danger:#dc2626;
    --radius:10px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:Inter,system-ui,Segoe UI,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; }

  /* ===== Bandeau ===== */
  header { background:var(--card); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10; }
  .nav { max-width:1100px; margin:auto; padding:8px 16px; display:flex; flex-direction:column; gap:6px; }
  .nav-top { display:flex; align-items:center; gap:14px; }
  .nav .spacer { flex:1; }
  .nav-bottom { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .nav-bottom input { margin-left:auto; padding:7px 12px; border:1px solid var(--border); border-radius:8px; font-size:.9rem; width:170px; }
  .nav a { text-decoration:none; color:var(--text); font-weight:500; white-space:nowrap; }
  .nav a:hover { color:var(--primary); }
  .logo { font-weight:800; font-size:1.2rem; color:var(--primary); text-decoration:none; }
  #authLinks { display:inline-flex; gap:8px; align-items:center; white-space:nowrap; }
  #userChip { font-weight:600; white-space:nowrap; }

  /* ===== Base ===== */
  main { max-width:1100px; margin:auto; padding:28px 16px 60px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:24px; margin-bottom:20px; }
  h1 { margin-bottom:8px; }
  h2 { margin:14px 0 8px; }
  .muted { color:var(--muted); font-size:.9rem; }
  .btn { display:inline-block; padding:8px 16px; border-radius:8px; border:none; cursor:pointer; font-weight:600; font-size:.9rem; text-decoration:none; text-align:center; }
  .btn-primary { background:var(--primary); color:#fff; }
  .btn-primary:hover { background:var(--primary-dark); }
  .btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
  .btn-danger { background:var(--danger); color:#fff; }
  .btn-sm { padding:4px 10px; font-size:.8rem; }
  .field { margin-bottom:14px; }
  .field label { display:block; font-size:.85rem; font-weight:600; margin-bottom:4px; }
  .field input, .field textarea, .field select { width:100%; padding:9px 12px; border:1px solid var(--border); border-radius:8px; font-size:.95rem; font-family:inherit; }
  textarea { min-height:260px; resize:vertical; }
  .flash { padding:10px 14px; border-radius:8px; margin-bottom:16px; font-size:.9rem; }
  .flash-ok { background:#dcfce7; color:#166534; }
  .flash-err { background:#fee2e2; color:#991b1b; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--border); }
  .tag { display:inline-block; background:#eff6ff; color:var(--primary); border-radius:20px; padding:2px 10px; font-size:.75rem; font-weight:600; }
  .tag-admin { background:#fef3c7; color:#92400e; }
  .breadcrumbs { font-size:.85rem; color:var(--muted); margin-bottom:14px; }
  .breadcrumbs a { color:var(--primary); text-decoration:none; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0; }
  .pageitem { display:flex; justify-content:space-between; align-items:center; padding:10px 4px; border-bottom:1px solid var(--border); gap:10px; }
  .pageitem a { color:var(--primary); font-weight:600; text-decoration:none; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; }

  /* ===== Bandeau d'images (accueil) ===== */
  .banner { position:relative; border-radius:var(--radius); overflow:hidden; margin-bottom:26px; border:1px solid var(--border); }
  .banner-slides { position:relative; height:300px; background:#fff; }
  .banner-slide { position:absolute; inset:0; opacity:0; transition:opacity .6s; }
  .banner-slide.active { opacity:1; }
  .banner-slide img, .banner-slide svg { width:100%; height:100%; object-fit:cover; display:block; }
  .banner-cap { position:absolute; left:0; right:0; bottom:0; padding:26px 20px 18px; color:#fff; text-align:center;
    background:linear-gradient(transparent,rgba(15,23,42,.75)); z-index:2; }
  .banner-cap h2 { font-size:1.5rem; margin:0; text-shadow:0 1px 4px rgba(0,0,0,.6); }
  .banner-cap p { margin:4px 0 0; font-size:.95rem; opacity:.95; text-shadow:0 1px 4px rgba(0,0,0,.6); }
  .banner-arrows { position:absolute; top:50%; transform:translateY(-50%); z-index:3; background:rgba(255,255,255,.85);
    border:1px solid var(--border); border-radius:50%; width:38px; height:38px; cursor:pointer; font-size:1.1rem;
    display:flex; align-items:center; justify-content:center; }
  .banner-prev { left:12px; } .banner-next { right:12px; }
  .banner-dots { position:absolute; bottom:10px; left:0; right:0; text-align:center; z-index:3; }
  .banner-dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.5); margin:0 4px; cursor:pointer; }
  .banner-dot.on { background:#fff; }
  .welcome { background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 24px; text-align:center; margin-bottom:26px; }
  @media (max-width:600px){ .banner-slides{ height:190px; } .nav-bottom input{ display:none; } }

  /* ===== Wiki ===== */
  .wiki-content { background:#fff; }
  .wiki-content h1 { font-size:1.6rem; }
  .wiki-content blockquote { border-left:4px solid var(--primary); background:#fafafa; margin:12px 0; padding:10px 16px; font-style:italic; border-radius:0 8px 8px 0; }
  .wiki-content hr { border:none; border-top:1px solid var(--border); margin:18px 0; }
  .wiki-content table { border:1px solid var(--border); margin:14px 0; }
  .wiki-content th { background:#f8fafc; }
  .wiki-content figure { margin:16px 0; text-align:center; }
  .wiki-content figure img { max-width:100%; max-height:420px; border-radius:8px; border:1px solid var(--border); }
  .wiki-content figcaption { font-size:.85rem; color:var(--muted); margin-top:6px; font-style:italic; }
  .toolbar { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .tool-btn { padding:5px 10px; border:1px solid var(--border); background:#fff; border-radius:6px; cursor:pointer; font-size:.85rem; font-weight:600; }
  .tool-btn:hover { border-color:var(--primary); }

  /* ===== Médiathèque ===== */
  .media-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; }
  .media-item { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; cursor:pointer; transition:transform .15s, box-shadow .15s; }
  .media-item:hover { transform:translateY(-3px); box-shadow:0 6px 18px rgba(0,0,0,.10); }
  .media-thumb { width:100%; height:130px; object-fit:cover; background:#0f172a; display:block; }
  .media-caption { padding:8px 10px; font-size:.85rem; font-weight:600; }
  .filters { display:flex; gap:8px; margin:6px 0 18px; flex-wrap:wrap; }
  .filter-btn { padding:6px 14px; border-radius:20px; border:1px solid var(--border); background:var(--card); cursor:pointer; font-size:.85rem; font-weight:600; }
  .filter-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }
  .modal-bg { position:fixed; inset:0; background:rgba(15,23,42,.85); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal-box { background:var(--card); border-radius:var(--radius); max-width:860px; width:100%; max-height:90vh; overflow:auto; padding:16px; position:relative; }
  .modal-box img, .modal-box video { width:100%; max-height:65vh; border-radius:8px; background:#000; display:block; }
  .modal-close { position:absolute; top:8px; right:12px; font-size:1.5rem; cursor:pointer; color:var(--muted); background:none; border:none; }
  .dropzone { border:2px dashed var(--border); border-radius:var(--radius); padding:22px; text-align:center; color:var(--muted); cursor:pointer; margin-bottom:12px; }
  .dropzone:hover { border-color:var(--primary); color:var(--primary); }

  /* ===== Calendrier ===== */
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .cal-dow { text-align:center; font-size:.75rem; font-weight:700; color:var(--muted); text-transform:uppercase; padding:4px 0; }
  .cal-day { background:#fafafa; border:1px solid var(--border); border-radius:8px; min-height:84px; padding:6px; cursor:pointer; }
  .cal-day:hover { border-color:var(--primary); }
  .cal-day.off { opacity:.35; }
  .cal-day.today { border-color:var(--primary); box-shadow:0 0 0 2px rgba(37,99,235,.25); }
  .cal-num { font-weight:700; font-size:.85rem; }
  .cal-ev { display:block; font-size:.7rem; background:var(--primary); color:#fff; border-radius:5px; padding:1px 5px; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cal-ev.mine { background:#7c3aed; }
  .cal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px; }
  .cal-title { font-size:1.3rem; font-weight:800; min-width:210px; text-align:center; }
  @media (max-width:600px){ .cal-day{ min-height:60px; } .cal-ev{ display:none; } }

  /* ===== Clubs ===== */
  .dept-badge { display:inline-block; background:#eff6ff; color:var(--primary); border-radius:6px; padding:2px 8px; font-size:.75rem; font-weight:700; }

  /* ===== Sécurité ===== */
  .rule { padding:14px 16px; border-left:4px solid var(--primary); background:#fafafa; border-radius:0 8px 8px 0; margin-bottom:12px; }
  .rule.sev-high { border-left-color:var(--danger); background:#fef2f2; }
  .rule.sev-mid { border-left-color:#f59e0b; background:#fffbeb; }
  .sev { font-size:.7rem; font-weight:800; text-transform:uppercase; padding:1px 8px; border-radius:12px; margin-left:8px; }
  .sev-high { background:#fee2e2; color:#991b1b; } .sev-mid { background:#fef3c7; color:#92400e; } .sev-low { background:#dcfce7; color:#166534; }
  .checkline { display:flex; gap:10px; align-items:flex-start; margin-bottom:10px; }
</style>
</head>
<body>
<header>
  <nav class="nav">
    <div class="nav-top">
      <a class="logo" href="#/">🤺 EsHAGE</a>
      <div class="spacer"></div>
      <span id="userChip"></span>
      <span id="authLinks"></span>
    </div>
    <div class="nav-bottom">
      <a href="#/">Accueil</a>
      <a href="#/wiki">Wiki</a>
      <a href="#/media">🎬 Médias</a>
      <a href="#/calendar">📅 Calendrier</a>
      <a href="#/clubs">🏛 Clubs</a>
      <a href="#/securite">🛡 Sécurité</a>
      <input id="navSearch" placeholder="Rechercher le wiki…" />
    </div>
  </nav>
</header>
<main id="app"></main>

<script>
"use strict";
/* ============================================================
   EsHAGE — Escrime Historique et Artistique du Grand Est
   Site associatif : wiki, médiathèque, calendrier, clubs,
   sécurité, comptes utilisateurs, administration.
   Données stockées dans le navigateur (localStorage).
   ============================================================ */

/* ---------- Stockage ---------- */
const DB = {
  get(k, fb) { try { return JSON.parse(localStorage.getItem("eshage_" + k)) ?? fb; } catch { return fb; } },
  set(k, v) { localStorage.setItem("eshage_" + k, JSON.stringify(v)); }
};
function hash(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return "h" + h.toString(16); }
function isoDay(d) { const z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const DEPTS = { "08":"Ardennes","10":"Aube","51":"Marne","52":"Haute-Marne","54":"Meurthe-et-Moselle","55":"Meuse","57":"Moselle","67":"Bas-Rhin","68":"Haut-Rhin","88":"Vosges" };

/* ---------- Données (toutes vierges au départ) ---------- */
let users  = DB.get("users", null) || [{ id:1, username:"admin", email:"admin@eshage.fr", pass:hash("admin123"), role:"admin", created:Date.now() }];
let wiki   = DB.get("wiki", []);
let cats   = DB.get("cats", []); // rubriques du wiki : { id, name }
let events = DB.get("events", []);
let media  = DB.get("media", []);
let clubs  = DB.get("clubs", []);
let rules  = DB.get("rules", []);
let bannerIds = DB.get("bannerIds", []);
let signedSafety = DB.get("signedSafety", {});
let session = DB.get("session", null);
DB.set("users", users); // persistance du compte admin
function saveWiki()  { DB.set("wiki", wiki); }
function saveCats()  { DB.set("cats", cats); }
function saveEvents(){ DB.set("events", events); }
function saveMedia() { DB.set("media", media); }
function saveClubs() { DB.set("clubs", clubs); }
function saveRules() { DB.set("rules", rules); }
function saveUsers() { DB.set("users", users); }
function saveBanner(){ DB.set("bannerIds", bannerIds); }
function saveSigned() { DB.set("signedSafety", signedSafety); }

/* ---------- Thème ---------- */
const THEME_DEFAULT = { primary:"#2563eb", primaryDark:"#1d4ed8", text:"#0f172a", muted:"#64748b", bg:"#ffffff", card:"#ffffff", border:"#e2e8f0", danger:"#dc2626" };
let theme = Object.assign({}, THEME_DEFAULT, DB.get("theme", {}));
function darken(hex, f=0.82){
  const n = parseInt(hex.slice(1), 16);
  const c = v => Math.round(v*f).toString(16).padStart(2,"0");
  return "#" + c((n>>16)&255) + c((n>>8)&255) + c(n&255);
}
function applyTheme(){
  const r = document.documentElement.style;
  r.setProperty("--primary", theme.primary);
  r.setProperty("--primary-dark", theme.primaryDark);
  r.setProperty("--text", theme.text);
  r.setProperty("--muted", theme.muted);
  r.setProperty("--bg", theme.bg);
  r.setProperty("--card", theme.card);
  r.setProperty("--border", theme.border);
  r.setProperty("--danger", theme.danger);
}
const THEME_PRESETS = {
  "Bleu classique": { primary:"#2563eb", text:"#0f172a", muted:"#64748b", border:"#e2e8f0", danger:"#dc2626" },
  "Rouge escrime":  { primary:"#b91c1c", text:"#1c1917", muted:"#78716c", border:"#e7e5e4", danger:"#b91c1c" },
  "Or & noir":      { primary:"#a16207", text:"#1c1917", muted:"#78716c", border:"#e7e5e4", danger:"#dc2626" },
  "Vert forêt":     { primary:"#15803d", text:"#14532d", muted:"#6b7280", border:"#e5e7eb", danger:"#dc2626" },
  "Violet":         { primary:"#7c3aed", text:"#1e1b4b", muted:"#6b7280", border:"#e5e7eb", danger:"#dc2626" }
};
const THEME_KEYS = [
  ["primary","Couleur principale (liens, boutons)"],
  ["text","Couleur de la police (texte principal)"],
  ["muted","Texte secondaire / légendes"],
  ["bg","Fond du site"],
  ["card","Fond des cartes / bandeau"],
  ["border","Bordures"],
  ["danger","Couleur d'alerte (suppression)"]
];

/* ---------- Session ---------- */
function currentUser(){ return users.find(u => u.id === session) || null; }
function requireLogin(){ if (!currentUser()) { location.hash = "#/login"; return false; } return true; }

/* ---------- Helpers ---------- */
const app = document.getElementById("app");
let flashMsg = null;
function flash(msg, ok=true){ flashMsg = {msg, ok}; }
function showFlash(){ if (!flashMsg) return ""; const f = flashMsg; flashMsg = null; return `<div class="flash ${f.ok?'flash-ok':'flash-err'}">${esc(f.msg)}</div>`; }
function fmt(ts){ return new Date(ts).toLocaleString("fr-FR"); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function slugify(t){ return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,""); }
function validHex(s){ return /^#[0-9a-fA-F]{6}$/.test(s.trim()); }

/* ---------- Rendu markdown simplifié (wiki) ---------- */
function renderMD(src){
  let html = esc(src);
  html = html.replace(/^###### (.*)$/gm,"<h6>$1</h6>").replace(/^##### (.*)$/gm,"<h5>$1</h5>")
             .replace(/^#### (.*)$/gm,"<h4>$1</h4>").replace(/^### (.*)$/gm,"<h3>$1</h3>")
             .replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^# (.*)$/gm,"<h1>$1</h1>");
  html = html.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>");
  html = html.replace(/`(.+?)`/g,"<code>$1</code>");
  html = html.replace(/\[\[(.+?)\]\]/g, (m,t) => {
    const p = wiki.find(w => slugify(w.title) === slugify(t) || w.slug === slugify(t));
    return p ? `<a href="#/wiki/${p.slug}">${t}</a>` : `<a class="muted" href="#/wiki/${slugify(t)}">${t}</a> (?)`;
  });
  html = html.replace(/^- (.*)$/gm,"<li>$1</li>").replace(/^(\d+)\. (.*)$/gm,"<li>$2</li>");
  html = html.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, m => "<ul>"+m+"</ul>");
  html = html.replace(/^---$/gm, "<hr>");
  html = html.replace(/^&gt; (.*)$/gm, "<blockquote>$1</blockquote>");
  html = html.replace(/(^\|.*\|$\n?)+/gm, block => {
    const rows = block.trim().split("\n").map(r => r.trim()).filter(Boolean);
    let out = "", tb = false;
    rows.forEach(r => {
      const cells = r.slice(1,-1).split("|").map(c => c.trim());
      if (/^\|[\s:|-]+\|$/.test(r)) { out += "</thead><tbody>"; tb = true; return; }
      if (!tb && !out.includes("<table")) out += "<table><thead>";
      const tag = tb ? "td" : "th";
      out += "<tr>" + cells.map(c => `<${tag}>${c}</${tag}>`).join("") + "</tr>";
    });
    return out + "</tbody></table>";
  });
  html = html.replace(/!\[(.*?)\]\((.*?)\)/g, (m, alt, src) => {
    let url = src;
    if (src.startsWith("#")) {
      const mm = media.find(x => x.id === parseInt(src.slice(1)));
      if (mm && mm.type === "image") url = mm.url; else return `<em class="muted">[média introuvable]</em>`;
    }
    return `<figure><img src="${url}" alt="${alt}" loading="lazy" />${alt ? `<figcaption>${alt}</figcaption>` : ""}</figure>`;
  });
  html = html.split(/\n{2,}/).map(b => /^\s*<(h\d|ul|li|hr|blockquote|table|figure|p)/.test(b) ? b : "<p>"+b.replace(/\n/g,"<br>")+"</p>").join("");
  return html;
}

/* ---------- Bandeau d'images par défaut ---------- */
const DEFAULT_SLIDES = [
  { title:"Escrime Historique et Artistique du Grand Est", sub:"Le sabre, le fleuret et l'histoire au service du spectacle",
    svg:'<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg"><rect width="800" height="300" fill="#1e3a8a"/><circle cx="650" cy="60" r="90" fill="#3b5bdb" opacity=".5"/><path d="M180 240 L520 90" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/><path d="M520 240 L180 90" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/><circle cx="180" cy="240" r="12" fill="#f59e0b"/><circle cx="520" cy="240" r="12" fill="#f59e0b"/><text x="400" y="275" font-family="serif" font-size="20" fill="#e0e7ff" text-anchor="middle" font-style="italic">EsHAGE</text></svg>' },
  { title:"Démonstrations historiques", sub:"Reconstitution de combats d'époques, du Moyen Âge à la Belle Époque",
    svg:'<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg"><rect width="800" height="300" fill="#0f172a"/><path d="M0 300 Q200 180 400 260 T800 220 V300 Z" fill="#1e293b"/><path d="M0 300 Q250 220 500 280 T800 250 V300 Z" fill="#334155"/><circle cx="120" cy="150" r="30" fill="#fbbf24" opacity=".9"/><path d="M300 260 L400 200" stroke="#cbd5e1" stroke-width="4"/><text x="560" y="150" font-family="serif" font-size="22" fill="#e2e8f0" text-anchor="middle" font-style="italic">Entre tradition et spectacle</text></svg>' },
  { title:"Ateliers ouverts à tous", sub:"Apprentissage de l'escrime de spectacle, de la chorégraphie au combat",
    svg:'<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg"><rect width="800" height="300" fill="#7c2d12"/><rect y="200" width="800" height="100" fill="#9a3412"/><path d="M460 180 L620 100" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/><path d="M340 180 L180 100" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/><text x="400" y="285" font-family="serif" font-size="18" fill="#ffedd5" text-anchor="middle" font-style="italic">L\'école des lames</text></svg>' }
];
let bannerIdx = 0, bannerTimer = null;

/* ---------- Navigation ---------- */
function renderNav(){
  const u = currentUser();
  document.getElementById("userChip").innerHTML = u ? `<span class="userchip">👤 ${esc(u.username)}</span>` : "";
  document.getElementById("authLinks").innerHTML = u
    ? `${u.role==="admin" ? '<a href="#/admin" style="margin-right:12px">Admin</a>' : ''}<a class="btn btn-outline btn-sm" href="#/logout">Déconnexion</a>`
    : `<a class="btn btn-outline btn-sm" href="#/register" style="margin-right:8px">Inscription</a><a class="btn btn-primary btn-sm" href="#/login">Connexion</a>`;
}

/* ============================================================
   PAGES
   ============================================================ */

/* ---------- Accueil ---------- */
function pageHome(){
  const u = currentUser();
  const bannerMedia = bannerIds.map(id => media.find(m => m.id === id)).filter(m => m && m.type === "image");
  const slides = bannerMedia.length ? bannerMedia.map(m => ({ title:m.title, sub:"Médiathèque — ajouté par " + m.author, url:m.url })) : DEFAULT_SLIDES;
  bannerIdx = Math.min(Math.max(bannerIdx, 0), slides.length - 1);
  const todayIso = isoDay(new Date());

  let w = slug ? wiki.find(x => x.slug === slug) : null;
  const catVal = document.getElementById("wCat") ? document.getElementById("wCat").value : null;
  if (w) {
    w.revisions.push({ content: w.content, author: w.author, date: w.updated });
    w.title = title; w.content = content; w.updated = Date.now(); w.author = u.username;
    w.cat = catVal ? parseInt(catVal) : null;
  } else {
    let s = slugify(title), base = s, n = 2;
    while (wiki.some(x => x.slug === s)) s = base + "-" + (n++);
    w = { id: Date.now(), title, slug: s, content, author: u.username, updated: Date.now(), revisions: [], cat: catVal ? parseInt(catVal) : null };
    wiki.push(w);
  }
  saveWiki(); flash("Page publiée !"); location.hash = "#/wiki/" + w.slug; render();

/* ---------- Import de documents Word (.docx / .doc) ---------- */
async function importDocx(file){
  if (!file) return;
  const u = currentUser(); if (!u) return;
  if (file.size > 8*1024*1024) { flash("Document trop volumineux (max 8 Mo).", false); return render(); }
  const fname = file.name.toLowerCase();
  try {
    let md;
    if (fname.endsWith(".docx")) {
      const xml = await extractDocxXml(await file.arrayBuffer());
      md = docxXmlToMarkdown(xml);
    } else {
      md = await legacyDocToText(file); // .doc binaire : extraction de texte best effort
    }
    if (!md.trim()) { flash("Le document semble vide ou illisible.", false); return render(); }
    // pré-remplit le titre si vide, insère le contenu
    const t = document.getElementById("wTitle");
    if (t && !t.value.trim()) t.value = file.name.replace(/\.[^.]+$/,"");
    insertTextAtCursor(md);
    flash("Document « " + file.name + " » importé ✔ Vérifiez la mise en page avant de publier.");
  } catch (e) {
    flash("Impossible de lire ce document : " + (e && e.message ? e.message : "format non reconnu") + ". Enregistrez-le au format .docx et réessayez.", false);
    render();
  }
}
/* Extrait word/document.xml d'un .docx (ZIP) sans bibliothèque externe */
async function extractDocxXml(buf){
  const dv = new DataView(buf);
  // recherche de la signature ZIP "PK\x03\x04"
  if (dv.getUint32(0, true) !== 0x04034b50) throw new Error("ce n'est pas un fichier .docx valide");
  // balayage des en-têtes locaux pour trouver word/document.xml
  let offset = 0, found = -1, nameLen, extraLen, method, compSize;
  while (offset + 30 <= buf.byteLength) {
    if (dv.getUint32(offset, true) === 0x04034b50) {
      method = dv.getUint16(offset + 8, true);
      compSize = dv.getUint32(offset + 18, true);
      nameLen = dv.getUint16(offset + 26, true);
      extraLen = dv.getUint16(offset + 28, true);
      const name = new TextDecoder().decode(new Uint8Array(buf, offset + 30, nameLen));
      if (name === "word/document.xml") { found = offset; break; }
      if (compSize === 0 && method === 0) { offset += 30 + nameLen + extraLen; } else { offset += 30 + nameLen + extraLen + compSize; }
    } else offset++;
  }
  if (found < 0) throw new Error("contenu du document introuvable");
  const dataStart = found + 30 + nameLen + extraLen;
  const raw = new Uint8Array(buf, dataStart, compSize);
  if (method === 0) return new TextDecoder().decode(raw);
  const ds = new DecompressionStream("deflate-raw");
  const stream = new Blob([raw]).stream().pipeThrough(ds);
  const out = await new Response(stream).text();
  return out;
}
/* Convertit le XML du document en markdown du wiki */
function docxXmlToMarkdown(xml){
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  if (doc.querySelector("parsererror")) throw new Error("document illisible");
  const NS = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
  const q = n => n.getElementsByTagNameNS(NS, n);
  let out = [];
  for (const p of doc.getElementsByTagNameNS(NS, "p")) {
    const pPr = p.getElementsByTagNameNS(NS, "pPr")[0];
    let heading = 0, isList = false;
    if (pPr) {
      const ps = pPr.getElementsByTagNameNS(NS, "pStyle")[0];
      const val = ps ? ps.getAttribute("w:val") || ps.getAttribute("val") : "";
      const m = /^Heading(\d)/i.exec(val || ""); if (m) heading = Math.min(+m[1], 6);
      isList = !!pPr.getElementsByTagNameNS(NS, "numPr")[0];
    }
    let line = "";
    for (const child of p.getElementsByTagNameNS(NS, "r")) {
      const rPr = child.getElementsByTagNameNS(NS, "rPr")[0];
      const bold = rPr && !!rPr.getElementsByTagNameNS(NS, "b")[0];
      const ital = rPr && !!rPr.getElementsByTagNameNS(NS, "i")[0];
      let text = "";
      const ts = child.getElementsByTagNameNS(NS, "t");
      for (const t of ts) text += t.textContent;
      const br = child.getElementsByTagNameNS(NS, "br");
      if (br.length) text += "\n";
      if (text) line += (bold ? "**" + text + "**" : ital ? "*" + text + "*" : text);
    }
    line = line.trim();
    if (!line) { out.push(""); continue; }
    if (heading) out.push("#".repeat(heading) + " " + line);
    else if (isList) out.push("- " + line);
    else out.push(line);
    out.push("");
  }
  return out.join("\n").replace(/\n{3,}/g, "\n\n").trim();
}
/* .doc binaire (ancien format) : extraction de texte best effort */
async function legacyDocToText(file){
  const buf = new Uint8Array(await file.arrayBuffer());
  let text = "";
  let i = 0;
  while (i < buf.length) {
    let chunk = "";
    while (i < buf.length && buf[i] >= 32 && buf[i] < 127) { chunk += String.fromCharCode(buf[i]); i++; }
    if (chunk.length >= 4 && /[a-zA-Zàâäéèêëîïôöùûüç]{3}/.test(chunk)) text += chunk + "\n\n";
    i++;
  }
  return text.trim();
}

          ? `<video class="media-thumb" src="${esc(m.url)}" muted preload="metadata"></video>`

function setMediaFilter(f){ mediaFilter = f; render(); }
function toggleUploadZone(){ const z = document.getElementById("uploadZone"); z.style.display = z.style.display === "none" ? "block" : "none"; }
function handleFiles(files){
  const u = currentUser(); if (!u || !files) return;
  [...files].forEach(f => {
    if (f.size > 2*1024*1024) { flash("« " + f.name + " » dépasse 2 Mo (fichier local).", false); return; }
    const type = f.type.startsWith("video") ? "video" : f.type.startsWith("image") ? "image" : null;
    if (!type) { flash("Type de fichier non pris en charge : " + f.name, false); return; }
    const r = new FileReader();
    r.onload = () => {
      media.push({ id: Date.now() + Math.floor(Math.random()*1000), type, title: f.name.replace(/\.[^.]+$/,""), url: r.result, isLocal: true, author: u.username, date: Date.now() });
      saveMedia(); flash("« " + f.name + " » ajouté ✔"); render();
    };
    r.readAsDataURL(f);
  });
}
function addMediaUrl(){
  const u = currentUser(); if (!u) return;
  const url = document.getElementById("mUrl").value.trim();
  if (!/^https?:\/\//.test(url)) { flash("URL invalide (http/https requise).", false); return render(); }
  media.push({ id: Date.now(), type: document.getElementById("mUrlType").value, title: url.split("/").pop().split("?")[0] || "Média", url, isLocal: false, author: u.username, date: Date.now() });
  saveMedia(); flash("Média ajouté par URL ✔"); render();
}
function openMedia(id){
  const m = media.find(x => x.id === id); if (!m) return;
  const u = currentUser();
  const modal = document.createElement("div");
  modal.className = "modal-bg";
  modal.innerHTML = `<div class="modal-box">
    <button class="modal-close" onclick="this.closest('.modal-bg').remove()">✕</button>
    ${m.type === "image" ? `<img src="${esc(m.url)}" alt="${esc(m.title)}" />` : `<video src="${esc(m.url)}" controls></video>`}
    <div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <div><strong>${m.type === "video" ? "🎞" : "🖼"} ${esc(m.title)}</strong><div class="muted">Ajouté par ${esc(m.author)} le ${fmt(m.date)}</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${u && u.role === "admin" && m.type === "image"
        ? (bannerIds.includes(m.id)
            ? `<button class="btn btn-outline btn-sm" onclick="toggleBanner(${m.id},false)">Retirer du bandeau</button>`
            : `<button class="btn btn-primary btn-sm" onclick="toggleBanner(${m.id},true)">Afficher dans le bandeau 🖼</button>`)
        : ""}
      ${u && (m.author === u.username || u.role === "admin") ? `<button class="btn btn-danger btn-sm" onclick="delMedia(${m.id})">🗑 Supprimer</button>` : ""}
      </div>
    </div></div>`;
  modal.addEventListener("click", e => { if (e.target === modal) modal.remove(); });
  document.body.appendChild(modal);
}
function delMedia(id){
  if (!confirm("Supprimer ce média ?")) return;
  media = media.filter(m => m.id !== id); saveMedia();
  document.querySelector(".modal-bg")?.remove();
  flash("Média supprimé."); render();
}
function toggleBanner(id, on){
  if (on) { if (!bannerIds.includes(id)) bannerIds.push(id); flash("Image ajoutée au bandeau d'accueil ✔"); }
  else { bannerIds = bannerIds.filter(i => i !== id); flash("Image retirée du bandeau."); }
  saveBanner();
  document.querySelector(".modal-bg")?.remove();
  render();
}

/* ---------- Calendrier ---------- */
let calY = null, calM = null, calDaySel = null, wikiSearch = "";
function pageCalendar(){
  const today = new Date();
  if (calY === null) { calY = today.getFullYear(); calM = today.getMonth(); }
  const nbDays = new Date(calY, calM + 1, 0).getDate();
  const startDow = (new Date(calY, calM, 1).getDay() + 6) % 7;
  const u = currentUser();
  let cells = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"].map(d => `<div class="cal-dow">${d}</div>`).join("");
  for (let i = 0; i < startDow; i++) cells += '<div class="cal-day off"></div>';
  const todayIso = isoDay(today);
  for (let d = 1; d <= nbDays; d++) {
    const iso = calY + "-" + String(calM+1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
    const evs = events.filter(e => e.date === iso);
    cells += `<div class="cal-day ${iso===todayIso?'today':''}" onclick="selectDay('${iso}')">
      <div class="cal-num">${d}</div>
      ${evs.slice(0,3).map(e => `<span class="cal-ev ${u && e.author===u.username?'mine':''}">${esc(e.title)}</span>`).join("")}
      ${evs.length>3 ? `<span class="muted" style="font-size:.7rem">+${evs.length-3} autres</span>` : ""}
    </div>`;
  }
  return showFlash() + `
  <div class="breadcrumbs"><a href="#/">Accueil</a> / Calendrier</div>
  <div class="cal-head">
    <h1>📅 Calendrier des événements</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn btn-outline" onclick="calMove(-1)">◀</button>
      <span class="cal-title">${MOIS[calM]} ${calY}</span>
      <button class="btn btn-outline" onclick="calMove(1)">▶</button>
      <button class="btn btn-outline btn-sm" onclick="calToday()">Aujourd'hui</button>
    </div>
  </div>
  ${u ? '' : '<p class="muted" style="margin-bottom:12px">Connectez-vous pour ajouter des événements.</p>'}
  <div class="card"><div class="cal-grid">${cells}</div></div>
  <div id="dayPanel"></div>`;
}
function calMove(d){ calM += d; if (calM < 0){ calM = 11; calY--; } if (calM > 11){ calM = 0; calY++; } render(); }
function calToday(){ const t = new Date(); calY = t.getFullYear(); calM = t.getMonth(); calDaySel = isoDay(t); render(); }
function selectDay(iso){ calDaySel = iso; render(); document.getElementById("dayPanel")?.scrollIntoView({behavior:"smooth", block:"center"}); }
function renderDayPanel(){
  if (!calDaySel) return "";
  const u = currentUser();
  const evs = events.filter(e => e.date === calDaySel).sort((a,b) => (a.time||"").localeCompare(b.time||""));
  const [y,m,d] = calDaySel.split("-");
  return `<div class="card">
    <h2>🗓 ${d} ${MOIS[+m-1]} ${y}</h2>
    ${u ? `
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin:12px 0">
      <div class="field" style="margin:0;flex:1;min-width:150px"><label>Titre</label><input id="evTitle" placeholder="Réunion, stage, représentation…" /></div>
      <div class="field" style="margin:0;width:90px"><label>Heure</label><input id="evTime" type="time" /></div>
      <button class="btn btn-primary" onclick="addEvent()">+ Ajouter</button>
    </div>` : ''}
    ${evs.length === 0 ? '<p class="muted">Aucun événement ce jour-là.</p>' :
      evs.map(e => `<div class="pageitem">
        <div><strong>${e.time ? esc(e.time)+" · " : ""}${esc(e.title)}</strong>
          ${e.desc ? `<div class="muted">${esc(e.desc)}</div>` : ""}
          <div class="muted" style="font-size:.8rem">par ${esc(e.author)}</div></div>
        ${u && (e.author === u.username || u.role === "admin") ? `<button class="btn btn-danger btn-sm" onclick="delEvent(${e.id})">Suppr.</button>` : ""}
      </div>`).join("")}
  </div>`;
}
function addEvent(){

function doRegister(){
  const username = document.getElementById("rUser").value.trim();
  const email = document.getElementById("rEmail").value.trim();
  const pass = document.getElementById("rPass").value;
  if (!/^[a-zA-Z0-9_.-]{3,20}$/.test(username)) { flash("Nom d'utilisateur invalide (3-20 caractères alphanumériques).", false); return render(); }
  if (!/^\S+@\S+\.\S+$/.test(email)) { flash("Email invalide.", false); return render(); }
  if (pass.length < 6) { flash("Mot de passe trop court (6 caractères minimum).", false); return render(); }
  if (users.some(u => u.username.toLowerCase() === username.toLowerCase())) { flash("Ce nom d'utilisateur est déjà pris.", false); return render(); }
  if (users.some(u => u.email.toLowerCase() === email.toLowerCase())) { flash("Cet email est déjà utilisé.", false); return render(); }
  const u = { id: Date.now(), username, email, pass: hash(pass), role: "member", created: Date.now() };
  users.push(u); saveUsers(); session = u.id; DB.set("session", session);
  flash("Compte créé avec succès ! 🎉"); location.hash = "#/"; render();
}

    <h1>👤 Mon profil</h1>
    <table style="margin-top:10px">
      <tr><th>Nom d'utilisateur</th><td>${esc(u.username)}</td></tr>
      <tr><th>Email</th><td>${esc(u.email)}</td></tr>
      <tr><th>Rôle</th><td><span class="tag ${u.role==='admin'?'tag-admin':''}">${u.role}</span></td></tr>
      <tr><th>Inscrit le</th><td>${fmt(u.created)}</td></tr>
      <tr><th>Pages wiki créées</th><td>${wiki.filter(w => w.author === u.username).length}</td></tr>
    </table>
    <div class="actions" style="margin-top:16px">
      <a class="btn btn-outline" href="#/wiki">Retour au wiki</a>
      <a class="btn btn-outline" href="#/profile/pass">Changer de mot de passe</a>
    </div>
  </div>`;
}
function pageChangePass(){
  const u = currentUser(); if (!requireLogin()) return "";
  return showFlash() + `
  <div class="card" style="max-width:420px;margin:40px auto">
    <h1>Changer de mot de passe</h1>
    <div class="field"><label>Mot de passe actuel</label><input id="pOld" type="password" /></div>
    <div class="field"><label>Nouveau mot de passe</label><input id="pNew" type="password" /></div>
    <button class="btn btn-primary" style="width:100%" onclick="doChangePass()">Valider</button>
  </div>`;
}
function doChangePass(){
  const u = currentUser();
  if (hash(document.getElementById("pOld").value) !== u.pass) { flash("Mot de passe actuel incorrect.", false); return render(); }
  const nw = document.getElementById("pNew").value;
  if (nw.length < 6) { flash("Nouveau mot de passe trop court.", false); return render(); }
  u.pass = hash(nw); saveUsers(); flash("Mot de passe modifié ✔"); location.hash = "#/profile"; render();
}

/* ---------- Administration ---------- */
function pageAdmin(){
  const u = currentUser();
  if (!u || u.role !== "admin") { flash("Accès réservé aux administrateurs.", false); return pageHome(); }
  return showFlash() + `
  <h1>🛠 Administration</h1>
  <div class="card" style="margin-top:16px">
    <h2>🎨 Apparence du site</h2>
    <p class="muted" style="margin-bottom:14px">Les changements s'appliquent immédiatement pour tous les visiteurs du site.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
      ${Object.entries(THEME_PRESETS).map(([name]) => `<button class="btn btn-outline btn-sm" onclick="applyPreset('${name}')">${name}</button>`).join("")}
      <button class="btn btn-outline btn-sm" onclick="resetTheme()">↺ Réinitialiser</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px">
      ${THEME_KEYS.map(([k,lbl]) => `<div class="field" style="margin:0">
        <label>${lbl}</label>
        <div style="display:flex;gap:8px;align-items:center">
          <input type="color" id="th_${k}" value="${theme[k]}" style="width:46px;height:34px;padding:2px;border:1px solid var(--border);border-radius:6px;cursor:pointer" oninput="previewTheme('${k}',this.value)" />
          <input value="${theme[k]}" oninput="previewTheme('${k}',this.value)" style="flex:1;font-family:monospace" />
        </div>
      </div>`).join("")}
    </div>
    <div class="actions" style="margin-top:16px">
      <button class="btn btn-primary" onclick="saveThemeFromForm()">💾 Enregistrer le thème</button>
    </div>
  </div>
  <div class="card">
    <h2>Utilisateurs (${users.length})</h2>
    <table><tr><th>Nom</th><th>Email</th><th>Rôle</th><th>Inscrit le</th><th></th></tr>
    ${users.map(x => `<tr><td>${esc(x.username)}</td><td>${esc(x.email)}</td>
      <td><span class="tag ${x.role==='admin'?'tag-admin':''}">${x.role}</span></td><td>${fmt(x.created)}</td>
      <td>${x.id !== u.id ? `<button class="btn btn-outline btn-sm" onclick="toggleRole(${x.id})">${x.role==='admin'?'→ membre':'→ admin'}</button> <button class="btn btn-danger btn-sm" onclick="delUser(${x.id})">Suppr.</button>` : '<span class="muted">vous</span>'}</td></tr>`).join("")}
    </table>
  </div>
  <div class="card">
    <h2>Pages du wiki (${wiki.length})</h2>
    ${wiki.length === 0 ? '<p class="muted">Aucune page.</p>' : `<table><tr><th>Titre</th><th>Auteur</th><th>Maj</th><th></th></tr>
    ${wiki.map(w => `<tr><td><a href="#/wiki/${w.slug}">${esc(w.title)}</a></td><td>${esc(w.author)}</td><td>${fmt(w.updated)}</td>
      <td><button class="btn btn-danger btn-sm" onclick="delPage(${w.id})">Supprimer</button></td></tr>`).join("")}
    </table>`}
  </div>
  <div class="card">
    <h2>Signatures des règles de sécurité</h2>
    ${Object.keys(signedSafety).length === 0 ? '<p class="muted">Aucune signature enregistrée.</p>' :
      `<table><tr><th>Membre</th><th>Signé le</th></tr>
      ${Object.entries(signedSafety).map(([uid, ts]) => {
        const m = users.find(x => x.id === +uid);
        return `<tr><td>${m ? esc(m.username) : "utilisateur #" + uid}</td><td>${fmt(ts)}</td></tr>`;
      }).join("")}</table>`}
  </div>`;
}
function toggleRole(id){ const x = users.find(u=>u.id===id); x.role = x.role==="admin"?"member":"admin"; saveUsers(); render(); }
function delUser(id){ if (!confirm("Supprimer cet utilisateur ?")) return; users = users.filter(u=>u.id!==id); saveUsers(); render(); }
function delPage(id){ if (!confirm("Supprimer cette page wiki ?")) return; wiki = wiki.filter(w=>w.id!==id); saveWiki(); render(); }
function previewTheme(k, v){
  v = v.trim(); if (!validHex(v)) return;
  theme[k] = v.toLowerCase();
  if (k === "primary") theme.primaryDark = darken(theme.primary);
  applyTheme();
}
function saveThemeFromForm(){
  for (const [k] of THEME_KEYS){
    const el = document.getElementById("th_" + k);
    if (el && validHex(el.value)) theme[k] = el.value.trim().toLowerCase();
  }
  theme.primaryDark = darken(theme.primary);
  DB.set("theme", theme); applyTheme();
  flash("Thème enregistré ✔"); render();
}
function applyPreset(name){
  const pt = THEME_PRESETS[name]; if (!pt) return;
  theme = Object.assign({}, THEME_DEFAULT, pt, { primaryDark: darken(pt.primary) });
  DB.set("theme", theme); applyTheme();
  flash("Palette « " + name + " » appliquée ✔"); render();
}
function resetTheme(){
  theme = Object.assign({}, THEME_DEFAULT, { primaryDark: darken(THEME_DEFAULT.primary) });
  DB.set("theme", theme); applyTheme();
  flash("Thème réinitialisé."); render();
}

/* ---------- Carrousel ---------- */
function bannerGo(d){ bannerSet(bannerIdx + d); }
function bannerSet(i){
  const el = document.getElementById("bannerSlides");
  const n = el ? el.children.length : 0; if (!n) return;
  bannerIdx = ((i % n) + n) % n;
  document.querySelectorAll("#bannerSlides .banner-slide").forEach((s,k) => s.classList.toggle("active", k === bannerIdx));
  document.querySelectorAll(".banner-dot").forEach((d,k) => d.classList.toggle("on", k === bannerIdx));
}
function restartBannerTimer(){
  clearInterval(bannerTimer);
  bannerTimer = setInterval(() => { if (document.getElementById("bannerSlides")) bannerSet(bannerIdx + 1); }, 5000);
}

/* ---------- Routeur ---------- */
function render(){
  renderNav();
  const h = location.hash.replace(/^#/, "") || "/";
  const parts = h.split("/").filter(Boolean);
  if (parts[0] === "logout") { session = null; DB.set("session", null); flash("Vous êtes déconnecté."); location.hash = "#/"; return; }
  if (parts[0] === "profile" && parts[1] === "pass") { app.innerHTML = pageChangePass(); return; }
  if (parts[0] === "profile") { app.innerHTML = pageProfile(); return; }
  if (parts[0] === "login") { app.innerHTML = pageLogin(); return; }
  if (parts[0] === "register") { app.innerHTML = pageRegister(); return; }
  if (parts[0] === "admin") { app.innerHTML = pageAdmin(); return; }
  if (parts[0] === "calendar") { app.innerHTML = pageCalendar() + renderDayPanel(); return; }
  if (parts[0] === "media") { app.innerHTML = pageMedia(); return; }
  if (parts[0] === "clubs") { app.innerHTML = pageClubs(); return; }
  if (parts[0] === "securite") { app.innerHTML = pageSecurite(); return; }
  if (parts[0] === "wiki") {
    if (!parts[1]) { app.innerHTML = pageWikiList(); return; }
    if (parts[1] === "new") { app.innerHTML = pageWikiEdit(null); return; }
    if (parts[1] === "edit") {
      if (h.includes("?new=")) { app.innerHTML = pageWikiEdit(null, decodeURIComponent(h.split("new=")[1]||"")); return; }
      app.innerHTML = pageWikiEdit(parts[2]); return;
    }
    if (parts[1] === "history") { app.innerHTML = pageHistory(parts[2]); return; }
    app.innerHTML = pageWikiView(parts[1]); return;
  }
  app.innerHTML = pageHome();
}

/* ---------- Démarrage ---------- */
window.addEventListener("hashchange", render);
document.getElementById("navSearch").addEventListener("input", e => {
  wikiSearch = e.target.value;
  if ((location.hash.replace(/^#/,"") || "/") !== "/wiki") location.hash = "#/wiki"; else render();
});
document.getElementById("navSearch").addEventListener("keydown", e => { if (e.key === "Enter") location.hash = "#/wiki"; });
render();
applyTheme();
restartBannerTimer();
</script>
</body>
</html>
